<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="projeto_base_prisma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>projeto_base_prisma</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1f43;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #bootstrap-splash {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0d1f43;
      opacity: 1;
      transition: opacity 220ms ease;
    }

    #bootstrap-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      overflow: hidden;
      background: rgb(255 255 255 / 14%);
    }

    .loading-indicator {
      width: 35%;
      height: 100%;
      background: #01d0af;
      animation: loading 1.2s ease-in-out infinite;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .splash-icon {
      width: min(54vw, 224px);
      height: min(54vw, 224px);
      margin-bottom: 12px;
      color: white;
    }

    .splash-title {
      margin: 0;
      color: white;
      font-size: clamp(42px, 15vw, 64px);
      font-weight: 700;
      letter-spacing: clamp(6px, 2.4vw, 10px);
    }

    .splash-tagline {
      margin: 36px 0 0;
      color: #01d0af;
      font-size: clamp(18px, 6.3vw, 26px);
      font-weight: 600;
      letter-spacing: clamp(3px, 1.2vw, 5px);
    }

    .splash-tagline + .splash-tagline {
      margin-top: 12px;
    }

    @keyframes loading {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(290%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-indicator {
        animation-duration: 3s;
      }

      #bootstrap-splash {
        transition-duration: 0ms;
      }
    }
  </style>
</head>
<body>
  <div id="bootstrap-splash" role="status" aria-label="Carregando o Prisma">
    <div class="loading-track" aria-hidden="true">
      <div class="loading-indicator"></div>
    </div>
    <main class="splash-content">
      <svg class="splash-icon" viewBox="0 0 128 128" aria-hidden="true">
        <path fill="currentColor" d="M64 13 5 43l59 30 47-24v34h9V43L64 13Zm-38 49v27c20 17 56 17 76 0V62L64 82 26 62Z"/>
      </svg>
      <h1 class="splash-title">PRISMA</h1>
      <p class="splash-tagline">TODAS AS MATÉRIAS.</p>
      <p class="splash-tagline">UM SÓ LUGAR.</p>
    </main>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
